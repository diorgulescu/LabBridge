name: Build Windows Executable

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build LabBridge.exe (x86_64-pc-windows-msvc)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Run Rust unit & integration tests
        run: cargo test --lib --manifest-path src-tauri/Cargo.toml

      - name: Package zero-admin LabBridge-Portable.zip & LabBridge.exe
        shell: pwsh
        run: ./scripts/package-portable.ps1

      - name: Upload LabBridge Windows executable & portable zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: LabBridge-Windows-x64
          path: |
            dist-portable/LabBridge-Portable.zip
            dist-portable/LabBridge/LabBridge.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release on version tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist-portable/LabBridge-Portable.zip
            dist-portable/LabBridge/LabBridge.exe
