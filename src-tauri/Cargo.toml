[package]
name = "labbridge"
version = "0.1.0"
description = "LabBridge — Engineering SSH Workbench"
authors = [
    "Dragoş Iorgulescu <32508790+diorgulescu@users.noreply.github.com>",
    "Antigravity <antigravity@google.com>",
    "Mistral Vibe <vibe@mistral.ai>",
]
edition = "2021"
default-run = "LabBridge"

[features]
default = []
custom-protocol = ["tauri/custom-protocol"]

[[bin]]
name = "LabBridge"
path = "src/main.rs"

[lib]
name = "labbridge_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
russh = "0.49"
russh-sftp = "2.1"
sha2 = "0.10"
hex = "0.4"
walkdir = "2.5"
ignore = "0.4"
tar = "0.4"
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
notify = "8"
notify-debouncer-full = "0.5"
rayon = "1.10"
async-trait = "0.1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

keyring = { version = "3", features = ["windows-native", "apple-native"] }

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
panic = "abort"

